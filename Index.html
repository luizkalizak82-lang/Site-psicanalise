<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cicera Pezzini | Psicanalista</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="leaf leaf-1"><i class="fas fa-leaf"></i></div>
    <div class="leaf leaf-2"><i class="fas fa-seedling"></i></div>
    <div class="leaf leaf-3"><i class="fas fa-spa"></i></div>

    <div class="main-container">
        <header>
            <div class="logo-text">CP</div>
            <p class="logo-sub">PSICANALISTA</p>
        </header>

        <main class="content">
            <h1 class="main-title">Saúde mental também é cuidado.</h1>
            
            <div class="profile-placeholder">
                <i class="fas fa-user-tie"></i>
            </div>

            <h2 class="name">Cicera Pezzini</h2>
            <p class="specialty">Psicanalista</p>

            <div class="divider"></div>

            <div class="info-box">
                <p><i class="fas fa-map-marker-alt"></i> Itapema, Santa Catarina e região</p>
                <p class="cta-text">Agende logo a sua terapia e vamos conversar</p>
            </div>

            <button id="whatsapp-button" class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i> AGENDAR PELO WHATSAPP
            </button>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
